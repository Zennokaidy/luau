name: Sync Fork with Upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream, protecting web/ and deploy.yml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Backup das suas customizações
          if [ -d web ]; then
            rm -rf /tmp/web-backup
            cp -r web /tmp/web-backup
          fi

          if [ -f .github/workflows/deploy.yml ]; then
            rm -rf /tmp/deploy-backup
            mkdir -p /tmp/deploy-backup
            cp .github/workflows/deploy.yml /tmp/deploy-backup/
          fi

          git remote add upstream https://github.com/luau-lang/playground.git || true
          git fetch upstream
          git merge upstream/main --no-edit -X theirs || {
            git add -A
            git commit -m "Auto-sync com upstream" || true
          }

          if [ -f wasm/src/playground.cpp ]; then
            sed -i 's/std::make_unique<Luau::Frontend>(Luau::SolverMode::New, Luau::SolverMode::Old,/std::make_unique<Luau::Frontend>(Luau::SolverMode::New,/g' wasm/src/playground.cpp
            sed -i 's/std::make_unique<Luau::Frontend>(Luau::SolverMode::New, Luau::SolverMode::New,/std::make_unique<Luau::Frontend>(Luau::SolverMode::New,/g' wasm/src/playground.cpp
            git add wasm/src/playground.cpp
          fi

          if [ -d /tmp/web-backup ]; then
            rm -rf web
            cp -r /tmp/web-backup web
            git add web
          fi

          if [ -f /tmp/deploy-backup/deploy.yml ]; then
            cp /tmp/deploy-backup/deploy.yml .github/workflows/deploy.yml
            git add .github/workflows/deploy.yml
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Sync com upstream e auto-fix de C++ (protege web/deploy)"
          fi

          git push origin main
